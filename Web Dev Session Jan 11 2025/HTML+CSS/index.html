<!DOCTYPE html>
<html>
  <head>
    <title>Day-2</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Day-2 Session</h1>
    <!-- login form -->
    <!-- registration form -->
    <section class="form-class">
      <form class="user-form">
        <section>
          <label>Name</label>
          <input type="text" placeholder="Enter Name" />
        </section>
        <section>
          <label>Date Of Birth</label>
          <input type="date" />
        </section>
        <section>
          <label>Email</label>
          <input type="email" placeholder="Enter email" />
        </section>
        <section>
          <label>Mobile</label>
          <input type="number" placeholder="Enter Mobile" />
        </section>
        <section>
          <label>Gender</label>
          <section>
            <input type="radio" name="gender" id="male" />
            <label for="male">Male</label>
          </section>
          <section>
            <input type="radio" name="gender" id="famale" />
            <label for="famale">Female</label>
          </section>
          <section>
            <input type="radio" name="gender" id="other" />
            <label for="other">Other</label>
          </section>
        </section>
        <section>
          <label>Address</label>
          <textarea
            type="text"
            rows="5"
            cols="50"
            placeholder="Enter Address"
          ></textarea>
        </section>
        <section>
          <label>City</label>
          <select>
            <option>--- select ---</option>
            <option>Mumbai</option>
            <option selected>Nashik</option>
            <option>Pune</option>
            <option>Nagpur</option>
          </select>
        </section>
        <section>
          <label>Upload Resume</label>
          <input type="file" />
        </section>
        <section>
          <label>Username</label>
          <input type="text" placeholder="Enter username" />
        </section>
        <section>
          <label>Password</label>
          <input type="password" placeholder="Enter Password" />
          <input type="checkbox" />
        </section>
        <section>
          <label>Confirm Password</label>
          <input type="text" placeholder="Enter Confirm Password" />
        </section>
        <section>
          <button type="submit">Save</button>
        </section>
      </form>
    </section>

    <section class="back-video">
      <section class="backdrop"></section>
      <video
        src="./videos/flower.webm"
        loop
        autoplay
        width="100%"
        height="100%"
      ></video>
    </section>
  </body>
</html>
