<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <style>
      .erp-row {
        display: block;
      }

      .epr-col-12 {
        width: 10%;
      }
    </style>
    <title>Introduction Bootstrap</title>
  </head>
  <body>
    <main class="container-fluid">
      <section class="row">
        <header class="col-12 bg-danger text-white">This is a header</header>
      </section>
      <section class="row">
        <section class="col-6 bg-success text-white">Section-1</section>
        <section class="col-6 bg-warning">Section-2</section>
      </section>
      <section class="row">
        <section class="col-8 bg-info">Col-8</section>
        <section class="col-2 bg-secondary text-white">Col-2</section>
        <section class="col-2 bg-danger text-white">Col-2</section>
        <footer class="col-12 bg-dark text-white">Footer</footer>
      </section>
      <!-- <section class="row">
        <section class="col-6">
          <section class="row">
            <article class="col-6"></article>
          </section>
        </section>
      </section> -->
    </main>
  </body>
</html>
