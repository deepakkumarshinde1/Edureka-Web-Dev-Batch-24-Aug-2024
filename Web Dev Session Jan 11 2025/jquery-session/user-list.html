<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jquery</title>
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css"
    />
    <link rel="stylesheet" href="./plugins/bs/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="./plugins/font-awesome-4.7.0/css/font-awesome.min.css"
    />
    <script src="./plugins/jquery/jquery-3.7.1.min.js"></script>
    <script src="./plugins/bs/js/bootstrap.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
  </head>
  <body>
    <main class="container-fluid">
      <section class="row justify-content-center">
        <section class="col-12">
          <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">User App</a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/"
                      >Home</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="/user-list.html">User List</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
        </section>
        <section class="col-12 mt-5 border border-2 border-light shadow p-3">
          <p class="text-center h3 text-secondary my-4">
            <i class="fa fa-users"></i> User List <i class="fa fa-users"></i>
          </p>
          <table class="table table-bordered">
            <thead>
              <tr>
                <th width="10%">Sr No</th>
                <th width="30%">Full Name</th>
                <th width="25%">Email</th>
                <th width="10%">Gender</th>
                <th width="15%">DOB</th>
                <th width="10%">Actions</th>
              </tr>
            </thead>
            <tbody id="userList">
              <tr>
                <td colspan="6">
                  <p class="mb-0 fw-bold text-center text-danger">
                    No User Found
                  </p>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </section>
    </main>
    <script src="./js/users.js"></script>
  </body>
</html>
